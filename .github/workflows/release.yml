name: Release

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::package.json version ($VERSION) and src-tauri/tauri.conf.json version ($TAURI_VERSION) don't match. Bump both to the same value."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file

      - name: Install frontend dependencies
        run: bun install

      - name: Build and bundle
        run: bun run tauri build

      - name: Generate checksums
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          (
            cd "$BUNDLE_DIR"
            : > SHA256SUMS
            for f in deb/*.deb appimage/*.AppImage rpm/*.rpm; do
              sha256sum "$f" | awk -v name="$(basename "$f")" '{print $1"  "name}' >> SHA256SUMS
            done
          )

      - name: Tag release commit
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "$BUNDLE_DIR"/deb/*.deb \
            "$BUNDLE_DIR"/appimage/*.AppImage \
            "$BUNDLE_DIR"/rpm/*.rpm \
            "$BUNDLE_DIR"/SHA256SUMS
