name: Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thermal-berry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::package.json version ($VERSION) and src-tauri/tauri.conf.json version ($TAURI_VERSION) don't match. Bump both to the same value."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release version must be numeric major.minor.patch."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists. Automatic publication will be skipped."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            packages: target/release/bundle/release-assets/*
          - platform: windows
            runner: windows-latest
            packages: target/release/bundle/nsis/*-setup.exe
          - platform: macos
            runner: macos-15
            packages: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file \
            apt-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test Linux
        if: matrix.platform == 'linux'
        run: |
          bun run build
          cargo test --locked --workspace
          bash tests/signed-release.sh

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        env:
          THERMAL_BERRY_RELEASE_PUBLIC_KEY: ${{ vars.THERMAL_BERRY_RELEASE_PUBLIC_KEY }}
        run: bun run tauri build -- --locked

      - name: Collect Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd target/release/bundle
          mkdir -p release-assets
          cp deb/*.deb appimage/*.AppImage rpm/*.rpm release-assets/

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: bun run tauri build --bundles nsis --no-sign -- --locked

      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --target universal-apple-darwin --bundles app,dmg -- --locked

      - name: Verify macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/thermal-berry.app
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fx 'Signature=adhoc'
          lipo "$app/Contents/MacOS/thermal-berry" -verify_arch arm64 x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thermal-berry-${{ matrix.platform }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  sign:
    needs: [check-version, build]
    if: github.event_name == 'push' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: thermal-berry-*
          path: packages
      - name: Install APT index tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Sign artifacts and APT metadata
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          THERMAL_BERRY_RELEASE_PUBLIC_KEY: ${{ vars.THERMAL_BERRY_RELEASE_PUBLIC_KEY }}
          THERMAL_BERRY_RELEASE_FINGERPRINT: ${{ vars.THERMAL_BERRY_RELEASE_FINGERPRINT }}
          THERMAL_BERRY_RELEASE_SIGNING_KEY: ${{ secrets.THERMAL_BERRY_RELEASE_SIGNING_KEY }}
        run: bash scripts/sign-release.sh "v$VERSION"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release
          path: signed/
          if-no-files-found: error

  apt:
    needs: sign
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  release:
    needs: [check-version, apt]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release
          path: signed
      - name: Verify and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          THERMAL_BERRY_RELEASE_PUBLIC_KEY: ${{ vars.THERMAL_BERRY_RELEASE_PUBLIC_KEY }}
          THERMAL_BERRY_RELEASE_FINGERPRINT: ${{ vars.THERMAL_BERRY_RELEASE_FINGERPRINT }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          cd signed
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s\n' "$THERMAL_BERRY_RELEASE_PUBLIC_KEY" | gpg --batch --dearmor > "$GNUPGHOME/release.gpg"
          keys=$(gpg --batch --show-keys --with-colons "$GNUPGHOME/release.gpg")
          fingerprint=$(awk -F: '$1=="pub" {count++} $1=="fpr" && !fingerprint {fingerprint=$10} END {if (count != 1) exit 1; print fingerprint}' <<< "$keys")
          [[ "$fingerprint" == "$THERMAL_BERRY_RELEASE_FINGERPRINT" ]]
          gpgv --keyring "$GNUPGHOME/release.gpg" SHA512SUMS.sig SHA512SUMS
          {
            printf '# Product: thermal-berry\n# Version: %s\n' "$tag"
            sha512sum -- *.AppImage *.rpm *-setup.exe *.dmg install.sh
          } | cmp - SHA512SUMS
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes \
            *.AppImage *.rpm *-setup.exe *.dmg install.sh SHA512SUMS SHA512SUMS.sig
