[package]
name = "thermal-berry-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["nvidia"]
nvidia = ["dep:libloading"]

[dependencies]
serde = { version = "1", features = ["derive"] }
dirs = "6"
sysinfo = { version = "=0.40.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "=0.7.4", optional = true }
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
serde_json = "1"
