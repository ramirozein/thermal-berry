[package]
name = "thermal-berry-headless"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["nvidia"]
nvidia = ["thermal-berry-core/nvidia"]

[dependencies]
thermal-berry-core = { path = "../thermal-berry-core", default-features = false }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
